name: Deploy backend to AWS

# Auto-deploys the backend to the AWS EC2 staging server on every push to main,
# and can be run manually. Uses GitHub OIDC to assume a least-privilege IAM role
# (no long-lived AWS keys stored in GitHub). The role can only trigger the SSM
# deploy on the project's tagged instance — the instance itself does the
# privileged work (reads secrets from SSM, pulls the repo, reloads PM2).

on:
  push:
    branches: [ main ]
  workflow_dispatch:

# Never run two deploys at once.
concurrency:
  group: aws-deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  id-token: write   # required for OIDC
  contents: read

env:
  AWS_REGION: us-east-1
  ROLE_ARN: arn:aws:iam::387039786667:role/theshippinghack-stage-github-deploy
  INSTANCE_NAME: theshippinghack-stage-api
  PROJECT_TAG: theshippinghack

jobs:
  verify:
    name: Syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: node --check all JS
        run: |
          set -e
          node --check shipping.js
          for d in controller routes middleware helper helpers models utils; do
            [ -d "$d" ] && find "$d" -name '*.js' -print0 | xargs -0 -r -n1 node --check
          done
          echo "Syntax OK"

  deploy:
    name: Deploy via SSM
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Send deploy to the instance via SSM
        run: |
          set -euo pipefail

          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=${INSTANCE_NAME}" \
                      "Name=tag:Project,Values=${PROJECT_TAG}" \
                      "Name=instance-state-name,Values=running" \
            --query 'Reservations[0].Instances[0].InstanceId' --output text --region "$AWS_REGION")
          if [ -z "$INSTANCE_ID" ] || [ "$INSTANCE_ID" = "None" ]; then
            echo "::error::No running instance found (tag Name=$INSTANCE_NAME, Project=$PROJECT_TAG)"
            exit 1
          fi
          echo "Target instance: $INSTANCE_ID"

          # Read the instance-side deploy script and pass it as JSON parameters
          # (JSON — not shorthand — so newlines survive; the lesson from 11-deploy-backend.sh).
          REMOTE="$(cat .github/deploy-remote.sh)"
          PARAMS="$(jq -n --arg cmd "$REMOTE" '{commands:[$cmd]}')"

          CMD_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --parameters "$PARAMS" \
            --timeout-seconds 600 \
            --comment "GitHub Actions deploy ${GITHUB_SHA::7}" \
            --query 'Command.CommandId' --output text --region "$AWS_REGION")
          echo "SSM command: $CMD_ID"

          aws ssm wait command-executed --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" --region "$AWS_REGION" || true

          STATUS=$(aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --query 'Status' --output text --region "$AWS_REGION")

          echo "----- deploy output -----"
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --query 'StandardOutputContent' --output text --region "$AWS_REGION" || true

          echo "----- status: $STATUS -----"
          if [ "$STATUS" != "Success" ]; then
            echo "::error::Deploy failed (status: $STATUS)"
            aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
              --query 'StandardErrorContent' --output text --region "$AWS_REGION" || true
            exit 1
          fi
          echo "Deploy succeeded."
